<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>恋愛クセ診断｜恋愛迷子から抜け出す、最初の一歩。</title>
<style>
:root{
  --bg:#FAF0F3; --card:#FFFFFF; --ink:#4A3A3E; --rose:#C2516F; --rose-dark:#9C4760;
  --rose-pale:#F6DFE6; --gold:#C9A227; --line:#E8D5DC; --navy:#3E4A66;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px;}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
.hidden{display:none!important;}
/* progress */
.progress{height:6px;background:var(--rose-pale);border-radius:3px;overflow:hidden;margin-bottom:10px;}
.progress i{display:block;height:100%;width:0%;background:var(--rose);border-radius:3px;transition:width .25s;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;min-height:32px;}
.backbtn{border:none;background:#fff;border-radius:8px;padding:6px 12px;color:var(--ink);font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.cheer{font-size:12px;color:var(--rose-dark);}
/* screens */
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;}
.title{ text-align:center;}
.title .badge{display:inline-block;font-size:12px;letter-spacing:.2em;color:var(--rose-dark);border:1px solid var(--rose);border-radius:999px;padding:2px 14px;margin-bottom:14px;}
.title h1{font-size:34px;letter-spacing:.06em;color:var(--rose-dark);margin-bottom:10px;}
.title p.catch{font-size:14px;color:var(--ink);margin-bottom:26px;}
.note{font-size:12px;color:#9b8288;margin-top:14px;}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--rose);color:#fff;box-shadow:0 3px 10px rgba(194,81,111,.35);}
.btn-outline{background:#fff;color:var(--rose-dark);border:1.5px solid var(--rose);}
.btn+.btn{margin-top:12px;}
.btn.pressed{background:var(--rose-dark)!important;color:#fff!important;border-color:var(--rose-dark)!important;transform:scale(.97);}
.scale-btns button.sel{background:var(--rose)!important;color:#fff!important;border-color:var(--rose)!important;}
/* question */
.qcount{font-size:12px;color:#b39aa1;text-align:right;}
.qcard{background:var(--card);border-radius:18px;padding:34px 22px;box-shadow:0 4px 16px rgba(156,71,96,.10);text-align:center;}
.qlead{font-size:12px;color:var(--rose-dark);letter-spacing:.15em;margin-bottom:14px;}
.qtext{font-size:19px;font-weight:600;line-height:1.8;min-height:5.4em;display:flex;align-items:center;justify-content:center;}
.scale{margin-top:22px;}
.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:#a08a90;margin-bottom:8px;}
.scale-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.scale-btns button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:16px 0;font-size:18px;font-weight:700;color:var(--rose-dark);cursor:pointer;transition:transform .06s;}
.scale-btns button:active{transform:scale(.94);background:var(--rose-pale);}
/* gender */
.gtitle{font-size:18px;font-weight:600;text-align:center;margin-bottom:22px;}
/* result */
.result{padding-bottom:40px;}
.rlead{ text-align:center;font-size:13px;color:var(--rose-dark);letter-spacing:.12em;margin:14px 0 10px;}
.cardimg{width:100%;border-radius:16px;box-shadow:0 6px 20px rgba(156,71,96,.18);display:block;}
.rname{ text-align:center;margin-top:16px;}
.rname .ruby{font-size:12px;letter-spacing:.35em;color:var(--gold);}
.rname h2{font-size:26px;letter-spacing:.04em;margin:2px 0 6px;}
.rname .rcatch{font-size:14px;color:var(--rose-dark);}
.section{background:#fff;border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 2px 10px rgba(156,71,96,.08);}
.section h3{font-size:14px;color:var(--rose-dark);letter-spacing:.1em;margin-bottom:12px;text-align:center;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bar-row .blabel{width:9em;font-size:12px;color:var(--ink);flex-shrink:0;}
.bar-track{flex:1;height:12px;background:var(--rose-pale);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;background:var(--rose);border-radius:6px;}
.bar-row.top .bar-fill{background:var(--rose-dark);}
.bar-row .bval{width:2.6em;font-size:11px;color:#a08a90;text-align:right;}
.aikotoba{ text-align:center;}
.aikotoba .word{font-size:22px;font-weight:700;color:var(--rose-dark);background:var(--rose-pale);border-radius:12px;padding:12px;margin:10px 0;letter-spacing:.05em;}
.aikotoba p{font-size:13px;}
.small{font-size:11px;color:#a08a90;margin-top:8px;}
footer{ text-align:center;font-size:11px;color:#b39aa1;padding:18px 0 8px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="chrome" class="hidden">
    <div class="progress"><i id="pbar"></i></div>
    <div class="topbar">
      <button class="backbtn" id="backBtn">← 戻る</button>
      <span class="cheer" id="cheer"></span>
    </div>
  </div>

  <!-- start -->
  <section id="scr-start" class="screen">
    <div class="title serif">
      <span class="badge">良縁ーおむすびー</span>
      <h1>恋愛クセ診断</h1>
      <p class="catch">恋愛迷子から抜け出す、最初の一歩。</p>
      <button class="btn btn-primary" onclick="goGender()">診断をはじめる</button>
      <p class="note">2分ほどで終わります。直感でお答えください。</p>
    </div>
  </section>

  <!-- gender -->
  <section id="scr-gender" class="screen hidden">
    <p class="gtitle">はじめに、あなたについて<br>教えてください</p>
    <button class="btn btn-outline" onclick="pressGo(this,()=>setGender('f'))">女性</button>
    <button class="btn btn-outline" onclick="pressGo(this,()=>setGender('m'))">男性</button>
  </section>

  <!-- question -->
  <section id="scr-q" class="screen hidden">
    <div class="qcard">
      <p class="qlead">どのくらい当てはまりますか？</p>
      <p class="qtext" id="qtext"></p>
      <div class="scale">
        <div class="scale-labels"><span>あてはまらない</span><span>あてはまる</span></div>
        <div class="scale-btns" id="scaleBtns"></div>
      </div>
    </div>
  </section>

  <!-- result -->
  <section id="scr-result" class="screen result hidden">
    <p class="rlead">あなたの恋愛のクセは……</p>
    <img id="cardImg" class="cardimg" alt="診断結果カード">
    <div class="rname serif hidden" id="rnameBox">
      <div class="ruby" id="rRuby"></div>
      <h2 id="rName"></h2>
      <p class="rcatch" id="rCatch"></p>
    </div>
    <div class="section aikotoba">
      <h3>── くわしい「取扱説明書」を受け取る ──</h3>
      <p>LINEに戻って、下の合言葉を<br>そのまま送ってください。<br>あなた専用の取扱説明書が届きます。</p>
      <div class="word" id="aikotoba"></div>
      <button class="btn btn-primary" id="lineBtn">LINEで合言葉を送る</button>
      <p class="small">※ボタンからうまく開けない場合は、合言葉をコピーしてLINEのトークに貼り付けて送ってください</p>
    </div>
    <footer>恋愛クセ診断｜良縁ーおむすびー</footer>
  </section>
</div>

<script>
// ====== 設定（あとから差し替え可能） ======
const IMAGE_BASE = "./cards/";
// 型別係数（診断ロジック_同意度方式_配点設計.md）実測分布を見て差し替え可
const COEF = {1:0.972, 2:0.972, 3:1.015, 4:1.035, 5:1.050, 6:0.972, 7:1.005};
const TIE_PRIORITY = [7,5,3,6,4,1,2];
// LINEトークへのプリフィルURL（Lステップ設定後に14本入れる。空なら合言葉表示のみ）
const RESULT_LINE_URLS = {
  "01":"","02":"","03":"","04":"","05":"","06":"","07":"",
  "08":"","09":"","10":"","11":"","12":"","13":"","14":""
};

// ====== 質問（診断質問_同意度方式.md v6・信念型21問・固定ミックス順） ======
// t=型 k=核(同点処理に使用) rev=逆読み先の型(不同意6-vを加点)
const QUESTIONS = [
 {t:6,k:1,rev:0,q:"条件で選ぶ出会いより、偶然の出会いに惹かれる"},
 {t:2,k:0,rev:0,q:"人に借りを作るのが、苦手だ"},
 {t:5,k:1,rev:0,q:"駆け引きするくらいなら、先に気持ちを伝えたい"},
 {t:4,k:1,rev:0,q:"自分の中の「理想の相手像」は、かなり具体的だ"},
 {t:1,k:0,rev:0,q:"自分の楽しみより、人が喜ぶ顔を見るほうが満たされる"},
 {t:7,k:1,rev:0,q:"自分の気持ちに確信が持てるまで、動きたくない"},
 {t:3,k:1,rev:0,q:"本気になった側が、負けだと思うことがある"},
 {t:6,k:1,rev:5,q:"焦って動くくらいなら、いいタイミングを待ちたい"},
 {t:2,k:1,rev:0,q:"守られるより、守るほうが落ち着く"},
 {t:4,k:1,rev:0,q:"妥協して選ぶくらいなら、選ばないほうがマシだと思う"},
 {t:7,k:0,rev:0,q:"自分の気持ちなのに、はっきり分からないときがある"},
 {t:5,k:1,rev:0,q:"関係がどうなるか分からない時間が、いちばん苦しい"},
 {t:1,k:1,rev:0,q:"わがままを言うくらいなら、我慢するほうを選んでしまう"},
 {t:3,k:1,rev:0,q:"期待して裏切られるより、最初から期待しないほうがいい"},
 {t:2,k:1,rev:0,q:"弱っている姿を見せるくらいなら、一人で抱えるほうがいい"},
 {t:6,k:0,rev:0,q:"人生は、無理に動かすより流れに乗るほうがうまくいくと思う"},
 {t:4,k:0,rev:0,q:"時間がかかっても、いちばん良いものを選びたい"},
 {t:5,k:0,rev:4,q:"じっくり考えるより、動きながら考えるほうだ"},
 {t:7,k:1,rev:0,q:"勢いで決めるくらいなら、決断は遅いほうがいい"},
 {t:1,k:1,rev:0,q:"好きな人のためなら、自分の予定は簡単に変えられる"},
 {t:3,k:0,rev:0,q:"心を許せる相手は、少数でいいと思っている"}
];

// ====== 14キャラ（型×性別） ======
const TYPES = {
 f: {
  1:{no:"01",img:"01_seijo.png",     ruby:"GIVER",        name:"ささげる聖女",       catch:"願いごとは、いつも相手の分。"},
  2:{no:"03",img:"03_queen.png",     ruby:"QUEEN",        name:"孤高の女王",         catch:"人に頼むくらいなら、自分でやったほうが早い。"},
  3:{no:"05",img:"05_hime.png",      ruby:"PRINCESS",     name:"難攻不落の姫",       catch:"ノックされるたび、鍵が増える。"},
  4:{no:"07",img:"07_judge.png",     ruby:"JUDGE",        name:"理想の鑑定士",       catch:"減点していくと、誰も残らない。"},
  5:{no:"09",img:"09_adventurer.png",ruby:"ADVENTURER",   name:"地図を忘れる冒険家", catch:"じっとしてると、不安が追いついてくる。"},
  6:{no:"11",img:"11_dreamer.png",   ruby:"DREAMER",      name:"星に願う夢見人",     catch:"運命の人と、いつか出会えるはず。"},
  7:{no:"13",img:"13_detective.png", ruby:"DETECTIVE",    name:"恋を捜査する探偵",   catch:"ときめかないと、好きじゃないのかな。"}
 },
 m: {
  1:{no:"02",img:"02_kishi.png",     ruby:"KNIGHT",       name:"尽くしすぎる騎士",   catch:"もらえる勲章は、「いい人だね」ばかり。"},
  2:{no:"04",img:"04_hero.png",      ruby:"HERO",         name:"孤軍奮闘の英雄",     catch:"SOSは、受信専用。"},
  3:{no:"06",img:"06_wolf.png",      ruby:"LONE WOLF",    name:"心を見せない一匹狼", catch:"興味ないフリして、誰より人を見てる。"},
  4:{no:"08",img:"08_meister.png",   ruby:"MEISTER",      name:"妥協しない職人",     catch:"☆4.8でも、まだ決めない。"},
  5:{no:"10",img:"10_hunter.png",    ruby:"HUNTER",       name:"待ち伏せできない狩人",catch:"狙いを定める前に、撃ってしまう。"},
  6:{no:"12",img:"12_samurai.png",   ruby:"SAMURAI",      name:"その時を待つ侍",     catch:"いつでも行ける。まだ行かないだけ。"},
  7:{no:"14",img:"14_sentinel.png",  ruby:"SENTINEL",     name:"石橋を砕く守人",     catch:"渡る前に、橋が無くなる。"}
 }
};
const TREND_LABEL = {1:"与えすぎ",2:"背負いすぎ",3:"守りすぎ",4:"考えすぎ",5:"動きすぎ",6:"待ちすぎ",7:"確かめすぎ"};

// ====== 状態 ======
let state = { gender:null, idx:0, answers:[] };
const $ = id => document.getElementById(id);
const save = () => { try{ sessionStorage.setItem("kcshindan_v2", JSON.stringify(state)); }catch(e){} };
const load = () => { try{ const s=JSON.parse(sessionStorage.getItem("kcshindan_v2")); if(s&&s.answers) state=s; }catch(e){} };

function show(id){
  ["scr-start","scr-gender","scr-q","scr-result"].forEach(s=>$(s).classList.add("hidden"));
  $(id).classList.remove("hidden");
  $("chrome").classList.toggle("hidden", id!=="scr-q");
  const neutral = (id==="scr-start" || id==="scr-gender");
  document.body.classList.toggle("phase-neutral", neutral);
  if(neutral) document.body.classList.remove("theme-m");
  window.scrollTo(0,0);
}
function goGender(){ show("scr-gender"); }
function pressGo(btn, fn){ btn.classList.add("pressed"); setTimeout(()=>{ btn.classList.remove("pressed"); fn(); }, 200); }
function setGender(g){ state.gender=g; applyTheme(g); state.idx=0; state.answers=[]; save(); renderQ(); }
function applyTheme(g){ document.body.classList.toggle("theme-m", g==="m"); }

function renderQ(){
  const i = state.idx;
  if(i >= QUESTIONS.length){ showResult(); return; }
  show("scr-q");
  $("qtext").textContent = QUESTIONS[i].q;
  const ratio = i / QUESTIONS.length;
  $("pbar").style.width = (ratio*100) + "%";
  $("cheer").textContent = ratio<0.34 ? "直感でサクサクどうぞ" : ratio<0.72 ? "半分をこえました" : "あとちょっと！";
  const box = $("scaleBtns"); box.innerHTML="";
  for(let v=1; v<=5; v++){
    const b=document.createElement("button");
    b.textContent=v;
    b.onclick=()=>{ b.classList.add("sel"); state.answers[i]=v; save(); setTimeout(()=>{ state.idx=i+1; save(); renderQ(); }, 160); };
    box.appendChild(b);
  }
}
$("backBtn").onclick = () => {
  if(state.idx===0){ show("scr-gender"); return; }
  state.idx--; save(); renderQ();
};

function judge(){
  const sum={}, cnt={}, core={};
  for(const t of [1,2,3,4,5,6,7]){ sum[t]=0; cnt[t]=0; core[t]=0; }
  QUESTIONS.forEach((qu,i)=>{
    const v = state.answers[i]||3;
    sum[qu.t]+=v; cnt[qu.t]++;
    if(qu.k) core[qu.t]+=v;
    if(qu.rev){ sum[qu.rev]+=(6-v); cnt[qu.rev]++; }
  });
  const score={};
  for(const t of [1,2,3,4,5,6,7]) score[t]=(sum[t]/cnt[t])*3*COEF[t];
  let best=[1];
  for(const t of [2,3,4,5,6,7]){
    if(score[t]>score[best[0]]+1e-9) best=[t];
    else if(Math.abs(score[t]-score[best[0]])<=1e-9) best.push(t);
  }
  let winner;
  if(best.length===1) winner=best[0];
  else{
    const md=Math.max(...best.map(t=>core[t]));
    const b2=best.filter(t=>core[t]===md);
    winner = b2.length===1 ? b2[0] : TIE_PRIORITY.find(t=>b2.includes(t));
  }
  return {winner, score};
}

function showResult(){
  const {winner, score} = judge();
  const c = TYPES[state.gender||"f"][winner];
  $("cardImg").src = IMAGE_BASE + c.img;
  $("cardImg").onerror = ()=>{ $("cardImg").style.display="none"; $("rnameBox").classList.remove("hidden"); };
  $("rRuby").textContent = "— " + c.ruby + " —";
  $("rName").textContent = "『" + c.name + "』";
  $("rCatch").textContent = c.catch;
  const word = "【診断結果" + c.no + "】";
  $("aikotoba").textContent = word;
  const url = RESULT_LINE_URLS[c.no];
  $("lineBtn").onclick = ()=>{
    if(url){ location.href=url; }
    else{
      navigator.clipboard && navigator.clipboard.writeText(word);
      alert("合言葉をコピーしました。LINEのトークに貼り付けて送ってください。");
    }
  };
  show("scr-result");
}

// 復元
load();
if(state.gender) applyTheme(state.gender);
if(state.gender && state.answers.length>0 && state.idx<QUESTIONS.length){ renderQ(); }
else if(state.gender && state.idx>=QUESTIONS.length && state.answers.length===QUESTIONS.length){ showResult(); }
</script>
</body>
</html>
