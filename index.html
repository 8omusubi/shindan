<style>
  :root{
    --bg:#fdf1f0;          /* クリームピンクの背景 */
    --card:#fffafa;        /* カード */
    --ink:#4a3a3c;         /* 文字（やわらかい墨） */
    --sub:#a98a8f;         /* 補助文字 */
    --accent:#d06a85;      /* 差し色（ローズピンク） */
    --accent-d:#b85070;    /* 濃いローズ */
    --line:#f0dde0;
    --soft:#fbe9ea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    line-height:1.8;
    letter-spacing:.02em;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 22px;
    box-shadow:0 6px 24px rgba(120,90,60,.06);
  }
  /* 進捗 */
  .progress{margin:0 0 18px;}
  .progress .label{font-size:12px;color:var(--sub);letter-spacing:.1em;margin-bottom:6px;}
  .bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-d));transition:width .35s ease;}
  /* タイトル */
  .brand{text-align:center;color:var(--sub);font-size:13px;letter-spacing:.18em;margin-bottom:14px;}
  h1{font-size:26px;text-align:center;margin:6px 0 4px;font-weight:600;}
  .catch{text-align:center;color:var(--accent-d);font-size:15px;margin:0 0 22px;}
  .lead{font-size:15px;color:var(--ink);margin:0 0 26px;text-align:center;}
  .note{font-size:13px;color:var(--sub);text-align:center;margin:18px 0 0;}
  /* 設問 */
  .qnum{font-size:13px;color:var(--accent);letter-spacing:.12em;margin-bottom:8px;}
  .q{font-size:18px;font-weight:600;margin:0 0 20px;}
  .choices{display:flex;flex-direction:column;gap:12px;}
  button.choice{
    text-align:left;font-family:inherit;font-size:15.5px;color:var(--ink);
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:15px 16px;cursor:pointer;transition:all .15s ease;line-height:1.65;
  }
  @media (hover:hover){ button.choice:hover{border-color:var(--accent);} }
  button.choice:active{transform:scale(.99);background:var(--soft);}
  button.choice.selected{border-color:var(--accent);background:var(--soft);}
  /* 汎用ボタン */
  .btn{
    display:inline-block;font-family:inherit;font-size:16px;font-weight:600;
    color:#fff;background:linear-gradient(180deg,var(--accent),var(--accent-d));
    border:none;border-radius:99px;padding:15px 34px;cursor:pointer;
    box-shadow:0 6px 16px rgba(124,82,57,.28);transition:transform .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .center{text-align:center;}
  .back{margin-top:18px;text-align:center;}
  .back button{background:none;border:none;color:var(--sub);font-family:inherit;font-size:13px;cursor:pointer;text-decoration:underline;}
  /* 結果 */
  .result .koe{font-size:16px;color:var(--accent-d);text-align:center;margin:4px 0 2px;}
  .result .tcard{width:100%;max-width:300px;border-radius:14px;display:block;margin:0 auto 18px;box-shadow:0 4px 14px rgba(120,90,60,.12);}
  .result .typrecname{font-size:13px;color:var(--sub);text-align:center;letter-spacing:.14em;}
  .result h2{font-size:30px;text-align:center;margin:8px 0 6px;font-weight:700;}
  .result .desc{font-size:15.5px;text-align:center;color:var(--ink);margin:14px 0 8px;}
  .result .feat{font-size:13.5px;text-align:center;color:var(--ink);margin:16px 0 4px;white-space:pre-line;line-height:2.2;}
  .result .hr{height:1px;background:var(--line);margin:24px 0;}
  .result .lead2{font-size:12.5px;margin:0 0 22px;}
  .fadein{animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .hidden{display:none;}
</style>
</head>

<div class="wrap">

</div>

/* =========================================================
   ④ 進行ロジック
   ========================================================= */
let cur = 0;                         // 現在の設問インデックス
const answers = new Array(QUESTIONS.length).fill(null); // 各設問で選んだ選択肢index

const el = id => document.getElementById(id);

function show(id){
  ["screen-start","screen-q","screen-result"].forEach(s=>el(s).classList.add("hidden"));
  el(id).classList.remove("hidden");
  el(id).classList.remove("fadein"); void el(id).offsetWidth; el(id).classList.add("fadein");
  window.scrollTo(0,0);
}

function start(){ cur=0; answers.fill(null); render(); show("screen-q"); }

function render(){
  const Q = QUESTIONS[cur];
  el("qcount").textContent = cur+1;
  el("barfill").style.width = ((cur+1)/QUESTIONS.length*100)+"%";
  const _p = (cur+1)/QUESTIONS.length;
  el("qcat").textContent = _p < 0.3 ? "リラックスして、直感でどうぞ"
    : _p < 0.5 ? "その調子です"
    : _p < 0.65 ? "半分まで来ました"
    : _p < 1 ? "あと少しです！"
    : "これで最後です";
  el("qtext").textContent = Q.q;
  const box = el("choices"); box.innerHTML = "";
  Q.a.forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = c.t;
    if(answers[cur]===i) b.classList.add("selected"); // 戻った時、前回選んだ選択肢を表示
    b.onclick = ()=>choose(i, b);
    box.appendChild(b);
  });
  el("backbtn").style.visibility = cur===0 ? "hidden" : "visible";
}

function choose(i, btn){
  if(choose.lock) return; choose.lock = true;        // 二度押し防止
  if(btn) btn.classList.add("selected");             // 押した瞬間の縁取り
  setTimeout(function(){
    choose.lock = false;
    answers[cur] = i;
    if(cur < QUESTIONS.length-1){ cur++; render(); window.scrollTo(0,0); }
    else { finish(); }
  }, 160);
}

function goBack(){ if(cur>0){ cur--; render(); window.scrollTo(0,0); } }

/* 判定：12スコア合計 → 最大値（同点は番号の小さいタイプ優先） */
function finish(){
  const score = {}; for(let t=1;t<=12;t++) score[t]=0;
  answers.forEach((ai,qi)=>{
    if(ai===null) return;
    const s = QUESTIONS[qi].a[ai].s;
    for(const t in s) score[t]+=s[t];
  });
  let best = 1;
  for(let t=2;t<=12;t++){ if(score[t] > score[best]) best = t; } // 厳密に大きい時だけ更新＝同点は若い番号が残る
  showResult(best, score);
}

function showResult(t, score){
  const T = TYPES[t];
  const img = el("r-img");
  if(IMAGE_BASE){
    // 画像に「あなたの恋愛のクセ／タイプ名」が入っているので、テキスト見出しは出さない（重複回避）
    const pad = String(t).padStart(2,"0");
    img.src = IMAGE_BASE + pad + ".png";   // 画像は 01.png〜12.png（半角数字）で置く
    img.alt = T.name + "タイプ";
    img.hidden = false;
    el("r-typrec").hidden = true;
    el("r-name").hidden = true;
  } else {
    // 画像なし（テスト時）はテキスト見出しを代わりに表示
    img.hidden = true;
    el("r-typrec").hidden = false;
    el("r-name").hidden = false;
    el("r-name").textContent = "「"+T.name+"」";
  }
  el("r-koe").textContent = T.koe;
  el("r-feat").textContent = T.feat || T.desc;
  // 傾向グラフ（上位3タイプ）
  const chart = el("r-chart");
  if(chart && score){
    const arr = [];
    for(let i=1;i<=12;i++) arr.push([i, score[i]||0]);
    arr.sort((a,b)=> b[1]-a[1] || a[0]-b[0]);
    const top = arr.slice(0,3);
    const max = top[0][1] || 1;
    chart.innerHTML =
      '<div style="font-size:13px;color:var(--sub);text-align:center;margin:18px 0 12px;letter-spacing:.08em">あなたの傾向（上位3タイプ）</div>' +
      top.map(function(p){
        var i=p[0], v=p[1], w=Math.round(v/max*100), on=(i===t);
        return '<div style="display:flex;align-items:center;gap:8px;margin:7px 0;font-size:11.5px">'
          +'<span style="flex:none;width:7.5em;text-align:right;white-space:nowrap;color:var(--ink)">'+TYPES[i].name+'</span>'
          +'<span style="flex:1;background:var(--soft);border-radius:99px;height:10px;overflow:hidden">'
          +'<i style="display:block;height:100%;border-radius:99px;width:'+w+'%;background:'+(on?'var(--accent-d)':'var(--accent)')+';opacity:'+(on?1:.5)+'"></i></span>'
          +'</div>';
      }).join('');
  }
  el("r-lead").textContent = "で、ここからが本題です👇";
  el("r-cta").href = RESULT_LINE_URLS[t] || "#";
  show("screen-result");
}
